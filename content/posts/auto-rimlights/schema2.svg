    <!-- DÉBUT DU BLOC DE CODE D'ANIMATION GLOBALE (SANS URL) -->
    <style type="text/css">
        /* Définition de l'animation de flux */
        @keyframes global-dash-flow {
            to {
                /* Décale le contour pour créer le mouvement. 
                   La valeur '0' fait défiler vers l'avant. */
                stroke-dashoffset: 0;
            }
        }

        /* Sélecteur CSS GLOBAL : Cible TOUS les path avec des pointillés */
        path[style*="stroke-dasharray"] {
            /* Force l'utilisation d'un décalage initial pour l'animation.
               Le décalage est le double de la taille d'un tiret standard (33.334)
               pour une boucle fluide, quelle que soit la longueur du chemin. */
            stroke-dashoffset: 33.334;
            
            /* Applique l'animation : nom, durée, timing linéaire, infini */
            animation: global-dash-flow 1s linear infinite !important;
        }
    </style>
    <!-- FIN DU BLOC DE CODE D'ANIMATION -->

